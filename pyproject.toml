[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postoffice"
dynamic = ["version"]
description = "Mister Mcfeely's Post Office - email management for bbsengine6"
requires-python = ">=3.9,<3.15"
dependencies = [
    "bbsengine6",
    "cryptography>=41.0.0",
    "passlib>=1.7.4",
]

[project.scripts]
mcfeely-authd = "mcfeely_authd.mcfeely_authd:main"

[tool.setuptools]
packages = ["postoffice", "mcfeely_authd"]

[tool.setuptools.package-dir]
"postoffice" = "src/postoffice"
"mcfeely_authd" = "src/mcfeely_authd"

[tool.setuptools.dynamic]
version = { attr = "postoffice._version.__version__" }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (e.g., IMAP server)",
]
