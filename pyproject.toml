[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postoffice"
dynamic = ["version"]
description = "Mister Mcfeely's Post Office - email management for bbsengine6"
requires-python = ">=3.9,<3.15"
dependencies = [
    "bbsengine6",
    "cryptography>=41.0.0",
    "passlib>=1.7.4",
]

[tool.setuptools]
packages = ["postoffice"]
script-files = [
    "bin/postoffice",
]

[tool.setuptools.package-data]
postoffice = ["sql/*.sql"]

[tool.setuptools.package-dir]
"postoffice" = "src/postoffice"

[tool.setuptools.dynamic]
version = { attr = "postoffice._version.__version__" }

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (e.g., IMAP server)",
]
collect_ignore = [
    "tests/imap_test_admin.py",
    "tests/imap_test_create_folder.py",
    "tests/imap_test_create_mailbox_with_acl.py",
    "tests/imap_test_delete_mailbox.py",
    "tests/imap_test_list_mailboxes.py",
    "tests/imap_test_list_messages.py",
    "tests/imap_test_login.py",
    "tests/imap_test_send.py",
    "tests/testimap.py",
]
