# /etc/imapd.conf
# Cyrus IMAPd daemon configuration for mistermcfeely
# Core IMAP protocol settings and feature configuration

##############################################
# Directory Configuration
##############################################

# Configuration directory (stores databases and state)
configdirectory: /var/lib/imap

# Default partition for mailbox spool
partition-default: /var/spool/imap

# Sieve script directory
sievedir: /var/lib/imap/sieve

##############################################
# Cyrus Administrator Settings
##############################################

# Cyrus administrators (space-separated)
# These users have full control over the IMAP server
admins: cyrus

# Allow Cyrus admins to proxy as other users
proxy_authz: yes

##############################################
# Authentication Configuration
##############################################

# Disable anonymous login - all users must authenticate
allowanonymouslogin: no

# Allow plain text authentication (requires TLS in production)
allowplaintext: no

# SASL authentication mechanisms
# PLAIN: RFC 4616 username/password
# LOGIN: Legacy MS Exchange/Outlook compatibility
sasl_mech_list: PLAIN LOGIN

# SASL configuration - use saslauthd for user verification
# (install cyrus-sasl and configure saslauthd separately)
sasl_pwcheck_method: saslauthd
saslauthd_path: /run/saslauthd/mux

# Seconds to wait before closing idle connection
timeout: 30

##############################################
# TLS/SSL Configuration (HIGHLY RECOMMENDED)
##############################################

# Enable TLS capabilities
tls_server_cert: /etc/pki/cyrus/imapd.pem
tls_server_key: /etc/pki/cyrus/imapd.pem

# CA certificate bundle for validation
tls_ca_path: /etc/pki/tls/certs/ca-bundle.crt

# Cipher suite (strong ciphers only)
tls_cipher_suite: HIGH:!aNULL:!MD5

# Require TLS for certain operations
# STARTTLS becomes mandatory for non-TLS connections
tls_require_cert: no

##############################################
# Sieve Configuration (Email Filtering)
##############################################

# Sieve script directory
sieve: /var/lib/imap/sieve/%d/%n

# Port for Sieve service (timsieved)
sieveport: 4190

# Sieve server name
sieveservername: localhost

# Maximum Sieve script size (in KB)
maxsievesize: 512

# Enable Sieve notify extension for email notifications
# (requires RFC 5435 implementation)
sieve_notifier: mailto

##############################################
# Quotas and Limits
##############################################

# Enable and configure quotas
quotas: yes

# Quota warning threshold (80% full)
quotawarnkb: 0

# Maximum size of individual messages (KB)
maxmessagesize: 102400

# Maximum number of recipients in a message
maxrecipientsperpage: 100

##############################################
# IMAP Extensions and Features
##############################################

# Enable IMAP4rev1 extension
imap_extensions: LIST-EXTENDED LITERAL+ SASL-IR

# Enable ANNOTATE extension for per-message metadata
# (critical for mistermcfeely claim tracking)
# This allows storing claim information on messages
enable_annotate: yes

# Annotation storage configuration
annotation_db: twoskip
annotation_db_path: /var/lib/imap/annotation.db

# Annotation providers
annotation_providers: /etc/imapd.annotations

# Annotation definitions file
annotation_definitions: /etc/imapd.annotations

# Enable COMPRESS extension (RFC 4978)
# Useful for bandwidth-constrained clients
enable_compress: yes

# Enable SPECIAL-USE extension (RFC 6154)
# Allows clients to identify system mailboxes (Drafts, Junk, etc.)
specialuse: yes

# Enable SORT extension (RFC 5256)
enable_sort: yes

# Enable THREAD extension (RFC 5256)
enable_thread: yes

# Enable SEARCH=RES extension
enable_search_res: yes

##############################################
# ACL (Access Control List) Settings
##############################################

# Enable ACL support (required for shared mailboxes)
# ACL entries define who can access each mailbox
#
# Supported rights:
# l = lookup (see mailbox in listing)
# r = read (fetch messages)
# s = see (see flags)
# w = write (set flags on messages)
# i = insert (add new messages)
# p = post (send message via LMTP to mailbox)
# c = create (create sub-mailboxes)
# d = delete (delete messages)
# a = admin (change ACLs)
#
# Example: alice@l rws = alice can lookup, read, see flags, and write flags

# Determine ACL on newly created mailboxes
# (derived from parent or explicit specification)
acl_admin: cyrus

##############################################
# Database Configuration
##############################################

# Database engines for various functions
# Options: berkeley, skiplist, twoskip, sql
# twoskip recommended for most setups

# Mailbox list database
mboxlist_db: twoskip

# Message delivery database
deliver_db: twoskip

# Subscription database (per-user subscribed mailboxes)
subscription_db: twoskip

# Seen state database
seen_db: twoskip

# Duplicate delivery detection
duplicate_db: twoskip

# TLS session cache
tlscache_db: twoskip

# Sieve script storage
sieve_db: twoskip

##############################################
# Event Notification Configuration
##############################################

# Notification method for mailbox events
# log: Write to syslog (testing/debugging)
# external: Send to external notification script
# none: Disable notifications
event_notifier: external

# Event groups to enable
# message: Message-related events (new, expunge, move)
# mailbox: Mailbox-related events (create, delete, rename)
# access: User activity events (login, logout)
event_groups: message mailbox access

# External notification script path (if event_notifier: external)
# This script receives RFC 5423 events via stdin
# Used for integration with mistermcfeely monitoring
event_notifier_path: /usr/local/bin/mcfeely-notify

##############################################
# Performance Tuning
##############################################

# Cache maintenance period (seconds)
cache_timeout: 11

# Aggressive cache mode (helps with sync speed)
# Warning: Use with caution in HA environments
cache_aggressive: no

# Enable mailbox cardinality cache
# Speeds up EXAMINE/STATUS commands
cache_mailbox: yes

# Connection pooling for backend servers
# Only relevant in murder (distributed) setup
maxmboxlist: 100000

##############################################
# Logging Configuration
##############################################

# Log level: 1=none, 2=error, 3=warning, 4=notice, 5=debug
loglevel: 3

# Log auth failures
log_auth: yes

# Log IMAP protocol trace (very verbose!)
# Only enable for debugging specific issues
trace: no

##############################################
# Murder Configuration (Distributed Setup)
##############################################

# Uncomment if using Cyrus murder (multiple backend servers)

# # Identity of this server in the cluster
# servername: imap.example.com

# # Type of server: be (backend), fe (frontend), mupdate
# servertype: be

# # Backend authentication for cluster communication
# # (requires separate mupdate server)
# mupdate_server: mupdate.example.com
# mupdate_port: 3905

##############################################
# Security and Access Control
##############################################

# Disable/prevent user creation of certain mailbox patterns
# (customize for your organization's needs)

# Restrict who can create mailboxes
# (cyrus admin can always create; others need special rights)
admins: cyrus

# Disable plaintext logins over non-TLS connections
# (already enforced with allowplaintext: no above)

# Require authentication for all mailbox operations
auxprop_plugin: sasldb

##############################################
# Maintenance and Cleanup
##############################################

# Expire deleted messages after this many days
# 0 = never expire
expunge_days: 0

# Cleanly close idle connections
idlesocket: /var/lib/imap/idlesocket

# Maximum number of open file descriptors
maxselfdiskusage: 0

##############################################
# Miscellaneous Settings
##############################################

# Enable RFC 2177 IDLE command
idle: yes

# Enable NOOP commands on open connections
enable_noop: yes

# Separate namespace for shared mailboxes
# (allows "shared/%username" or "shared/teamname" patterns)
sharedprefix: shared

# Enable MYRIGHTS command (show current user's rights)
enable_myrights: yes

# Enable GETMETADATA extension (RFC 5464)
enable_getmetadata: yes

# Report capabilities to clients
# (add capabilities here if using extensions)
# capability: IMAP4rev1 STARTTLS LOGIN PLAIN ANNOTATE-EXPERIMENT-1

# BCC default delivery address (optional)
# Any message in shared mailboxes gets BCC'd to this user
# (useful for audit/compliance; leave empty if not needed)
# bcc_archive_address: archive@example.com

##############################################
# Sieve and Filtering
##############################################

# Enable Sieve global scripts
global_sieve_scripts: /var/lib/imap/global_scripts

# Default Sieve action if script missing
sieve_default_actions: yes

# Filter actions by user
allow_sieve_filters: yes

# CMU Sieve extensions (advanced features)
enable_sieve_error_handling: yes

# Sieve maximum compile time
sieve_maxscriptsize: 32768
