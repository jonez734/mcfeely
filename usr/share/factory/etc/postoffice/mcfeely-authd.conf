# mcfeely-authd.conf
# Configuration for postoffice-authd SASL authentication daemon
# (filename keeps the historical 'mcfeely-' name; only the binary was renamed)
# Location: /etc/postoffice/mcfeely-authd.conf

###############################################################################
# Database Configuration
###############################################################################

[database]
# PostgreSQL connection string
# Format: postgresql://[user[:pass]@][host[:port]][/dbname]
dsn = postgresql://localhost/zoid6test

# Or use individual settings:
# user = postoffice
# password = 

###############################################################################
# Authentication Configuration
###############################################################################

[auth]
# Enable PAM fallback for users not in database
# Set to 'no' to require all users to have database entries
fallback_pam = yes

# PAM service name for fallback authentication
pam_service = imap

###############################################################################
# Socket Configuration
###############################################################################

[socket]
# Path to UNIX socket for saslauthd communication
# Must match AUTHDAEMOND_PATH in /etc/saslauthd.conf
path = /var/run/postoffice-authd/mux

###############################################################################
# Logging Configuration
###############################################################################

[logging]
# Log file path
file = /var/log/postoffice-authd.log

# Log level: DEBUG, INFO, WARNING, ERROR
level = INFO

# Enable syslog logging
syslog = yes

###############################################################################
# Daemon Configuration
###############################################################################

[daemon]
# PID file path
pid_file = /var/run/postoffice-authd/mcfeely-authd.pid

# Connection timeout (seconds)
timeout = 30

# Maximum number of child processes (0 = unlimited)
max_children = 50
