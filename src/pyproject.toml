[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postoffice"
dynamic = ["version"]
description = "Virtual and mailbox email account management built upon bbsengine6"
requires-python = ">=3.9,<3.13"
license = "GPL-2.0-or-later"
authors = [
    { name = "zoidtechnologies.com", email = "postoffice@projects.zoidtechnologies.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Topic :: Terminals",
]
dependencies = [
    "bbsengine6",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
postoffice = "postoffice.__main__:main"
mistermcfeely-password-tui = "postoffice.password.__init__:main"

[project.urls]
Homepage = "https://repo.zoidtechnologies.com/postoffice/"

[tool.setuptools.packages.find]
where = ["."]
include = ["postoffice*"]

[tool.setuptools.dynamic]
version = { attr = "postoffice._version.__version__" }

[tool.setuptools.package-data]
postoffice = ["*.sql"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (e.g., IMAP server)",
]
