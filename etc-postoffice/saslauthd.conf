# saslauthd.conf
# SASL authentication daemon configuration for mistermcfeely Cyrus IMAP server
# Location: /etc/sasl2/saslauthd.conf (or /etc/saslauthd.conf on Debian)

###############################################################################
# Mechanism Configuration
###############################################################################

# Authentication mechanisms to use
# rimap: Authenticate against a remote IMAP server
# getpwent: Use local /etc/passwd
# shadow: Use local /etc/shadow
# ldap: Use LDAP directory
# pam: Use PAM (default on many systems)
MECHANISMS = pam

###############################################################################
# PAM Configuration
###############################################################################

# PAM service name for authentication
# This references /etc/pam.d/saslauthd or /etc/pam.d/imap
PAM_SERVICE = imap

###############################################################################
# LDAP Configuration (if using LDAP)
###############################################################################

# Uncomment and configure if using LDAP authentication
#ldap_servers: ldap://ldap.example.com
#ldap_bind_dn: cn=proxyuser,dc=example,dc=com
#ldap_bind_pw: proxy_password
#ldap_search_base: dc=example,dc=com
#ldap_filter: (uid=%u)
#ldap_version: 3
#ldap_auth_method: bind

###############################################################################
# RIMAP Configuration (if using remote IMAP)
###############################################################################

# Uncomment and configure if using RIMAP
#rimap_host: localhost
#rimap_port: 143

###############################################################################
# Runtime Configuration
###############################################################################

# Socket directory (must match saslauthd startup)
SOCKETDIR = /var/run/saslauthd

# PID file location
PIDFILE = /var/run/saslauthd/saslauthd.pid

# Additional flags
# -r: Combine realm and username (user@realm -> user realm)
FLAGS = ""