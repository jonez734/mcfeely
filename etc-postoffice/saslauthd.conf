# saslauthd.conf
# SASL authentication daemon configuration for postoffice Cyrus IMAP server
# Location: /etc/sasl2/saslauthd.conf (or /etc/saslauthd.conf on Debian)

###############################################################################
# Mechanism Configuration
###############################################################################

# Authentication mechanism: authdaemond
# The postoffice-authd daemon handles database authentication with PAM fallback.
# This replaces the previous PAM-based configuration.
MECHANISMS = authdaemond

# Path to postoffice-authd UNIX socket
# postoffice-authd listens on this socket and handles auth requests.
AUTHDAEMOND_PATH = /var/run/postoffice-authd/mux

###############################################################################
# Previous PAM Configuration (Commented Out - for reference)
###############################################################################
# PREVIOUS: MECHANISMS = pam
# PREVIOUS: PAM_SERVICE = imap
#
# The old configuration used system passwords via PAM:
# - Users authenticated with their shell password (/etc/shadow)
# - No separation between shell and IMAP passwords
# - SSH key-only users couldn't access IMAP
#
# Migration: Users should set IMAP passwords via the postoffice password
# management system, which stores SHA-512 crypt hashes in
# postoffice.sasl_password table.

###############################################################################
# Alternative Auth Mechanisms (Documented for reference)
###############################################################################

# Alternative 1: LDAP (if using directory service)
# MECHANISMS = ldap
# ldap_servers: ldap://ldap.example.com
# ldap_bind_dn: cn=proxyuser,dc=example,dc=com
# ldap_bind_pw: proxy_password
# ldap_search_base: dc=example,dc=com
# ldap_filter: (uid=%u)
# ldap_version: 3
# ldap_auth_method: bind

# Alternative 2: RIMAP (authenticate against remote IMAP server)
# MECHANISMS = rimap
# rimap_host: imap.example.com
# rimap_port: 143

# Alternative 3: SQL auxprop (direct SQL lookup - requires special hash format)
# Note: Requires libsasl2-modules-sql package and SHA-512 crypt hashes in DB
# MECHANISMS = sql auxprop
# sql_engine: pgsql
# sql_hostnames: localhost:5432
# sql_database: zoid6test
# sql_user: postoffice
# sql_passwd: 
# sql_select: SELECT crypt_hash FROM postoffice.sasl_password WHERE member_moniker = '%u'

###############################################################################
# Runtime Configuration
###############################################################################

# Socket directory (must match postoffice-authd socket path)
SOCKETDIR = /var/run/postoffice-authd

# PID file location
PIDFILE = /var/run/postoffice-authd/saslauthd.pid

# Additional flags
# -r: Combine realm and username (user@realm -> user realm)
FLAGS = "-r"

###############################################################################
# PAM Fallback Configuration
###############################################################################
# PAM fallback is handled by postoffice-authd, not saslauthd directly.
# The postoffice-authd daemon will:
# 1. First check postoffice.sasl_password for user's crypt hash
# 2. If not found and fallback_pam=yes, try PAM authentication
# 3. Return OK/NO based on result
#
# See /etc/mcfeely-authd.conf for postoffice-authd configuration.