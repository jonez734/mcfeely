# /etc/sasl2/sql.conf -- libsasl2 auxprop-sql config
#
# Only used if /etc/postoffice/imapd.conf is set to:
#   sasl_pwcheck_method: auxprop
#   sasl_auxprop_plugin: sql
# (Mode C, an alternative to the default auxprop-pam path.)
#
# Queries postoffice.sasl_password (SHA-512 crypt hashes) for the
# credential. Requires engine.__member.approved = true AND
# sasl_password.enabled = true AND engine.__member.accountexpires IS NULL
# OR > now().

# Database engine. 'pgsql' is what the Jammy libsasl2-modules-sql
# package ships.
sql_engine: pgsql

# Connection. Operator must set sql_passwd to the dovecot Postgres
# role password (or rely on peer auth via UNIX socket; libsasl2
# sql driver does not support peer auth directly, so a password is
# required in practice).
sql_hostnames: localhost:5432
sql_database: zoid6test
sql_user: dovecot

# Password is read from this file (mode 0600 root). Never committed.
# Operator: sudo install -m 0600 /dev/null /etc/sasl2/sql.dbnpass
#           then sudoedit /etc/sasl2/sql.dbnpass and paste the dovecot
#           role password.
sql_passwd: <read from /etc/sasl2/sql.dbnpass at SASL startup>

# Auxprop select: returns the SHA-512 crypt hash. libsasl2 verifies
# it via crypt(3) internally. The JOIN enforces the BBS gate so
# an approved=false or expired user can't IMAP even with the right
# password.
sql_select: SELECT crypt_hash FROM postoffice.sasl_password sp JOIN engine.__member m ON m.moniker = sp.member_moniker WHERE sp.member_moniker = '%u' AND sp.enabled = true AND m.approved = true AND (m.accountexpires IS NULL OR m.accountexpires > now())

# No TLS to the local Postgres; the UNIX socket is fine when the
# DSN points at localhost. Set sql_usessl: yes for cross-host.
sql_usessl: no
