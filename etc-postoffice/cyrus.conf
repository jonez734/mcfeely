# /etc/cyrus.conf
# Cyrus IMAPd master configuration for mistermcfeely
# Manages Cyrus IMAP services and daemon processes

##############################################
# Services Configuration
##############################################

Services {
  # IMAP service - plain text connection on port 143
  imap        cmd="imapd -U 30" listen="imap" prefork=0 maxchild=100

  # IMAPS service - TLS connection on port 993
  imaps       cmd="imapd -s -U 30" listen="imaps" prefork=0 maxchild=100

  # Sieve service for mail filtering on port 4190
  sieve       cmd="timsieved" listen="sieve" prefork=0 maxchild=10

  # LMTP service for message delivery from Postfix
  lmtp        cmd="lmtpd -U 30" listen="lmtp" prefork=0 maxchild=20

  # Notification daemon for mailbox events (notifyd)
  # Listens on Unix socket for event notifications
  notify      cmd="notifyd" listen="/var/lib/imap/notify" proto="udp" prefork=1
}

##############################################
# Daemon Configuration
##############################################

Daemons {
  # Timsieved (Sieve server) - for email filtering rules
  timsieved       cmd="timsieved"

  # Partition maintenance and backup daemon
  ctl_mboxlist    cmd="ctl_mboxlist -r"
  ctl_deliver     cmd="ctl_deliver -r"

  # Cyrus master process management
  ctl_cyrusdb     cmd="ctl_cyrusdb -c" period=30
}

##############################################
# Logging Configuration
##############################################

Logging {
  # Log to syslog with facility MAIL
  default: syslog
  
  # Specific service logging
  imapd: syslog
  lmtpd: syslog
  timsieved: syslog
  notifyd: syslog
  master: syslog
}

##############################################
# Event Configuration
##############################################

Events {
  # Enable event reporting for notifyd integration
  # Events are sent to notifyd for real-time notifications
  #
  # Supported event classes:
  # - MessageNew: New message in mailbox
  # - MessageExpunge: Message expunged/deleted
  # - MessageMove: Message moved between mailboxes
  # - MailboxCreate: Shared mailbox created
  # - MailboxDelete: Shared mailbox deleted
  # - MailboxRename: Shared mailbox renamed
  #
  # This section enables event reporting for mistermcfeely
  # monitoring and notifyd integration
}

