# mcfeely-authd.conf
# Configuration for postoffice-authd SASL authentication daemon
# (filename keeps the historical 'mcfeely-' name; only the binary was renamed)
# Location: /etc/postoffice/mcfeely-authd.conf

###############################################################################
# Database Configuration
###############################################################################

[database]
# PostgreSQL connection string
# Format: postgresql://[user[:pass]@][host[:port]][/dbname]
dsn = postgresql://localhost/zoid6test

# Or use individual settings:
# user = postoffice
# password = 

###############################################################################
# Authentication Configuration
###############################################################################

[auth]
# Enable PAM fallback for users not in database
# Set to 'no' to require all users to have database entries
fallback_pam = yes

# PAM service name for fallback authentication
pam_service = imap

###############################################################################
# Socket Configuration
###############################################################################

[socket]
# Path to UNIX socket for saslauthd communication
# Must match AUTHDAEMOND_PATH in /etc/saslauthd.conf
path = /var/run/postoffice-authd/mux

###############################################################################
# Logging Configuration
###############################################################################

[logging]
# Log file path
file = /var/log/postoffice-authd.log

# Log level: DEBUG, INFO, WARNING, ERROR
level = INFO

# Enable syslog logging
syslog = yes

###############################################################################
# Daemon Configuration
###############################################################################

[daemon]
# PID file path
pid_file = /var/run/postoffice-authd/mcfeely-authd.pid

# Connection timeout (seconds)
timeout = 30

# Maximum number of child processes (0 = unlimited)
max_children = 50

###############################################################################
# Environment Variables (alternative to config file)
###############################################################################
# BBSENGINE6_DBNAME - Override database name
#   Example: export BBSENGINE6_DBNAME=zoid6test
#
# POSTOFFICE_PASSWORD_KEY - Encryption key (not used by postoffice-authd,
#   but may be needed by related tools)

###############################################################################
# Previous PAM Configuration (Reference)
###############################################################################
# The previous configuration used PAM directly:
# saslauthd.conf:
#   MECHANISMS = pam
#   PAM_SERVICE = imap
#
# pam.d-imap:
#   auth        sufficient    pam_unix.so nullok try_first_pass
#   auth        required      pam_deny.so
#
# This has been replaced with authdaemond mechanism:
# saslauthd.conf:
#   MECHANISMS = authdaemond
#   AUTHDAEMOND_PATH = /var/run/postoffice-authd/mux
#
# Users are now authenticated via the postoffice.sasl_password table
# with SHA-512 crypt hashes. PAM fallback is available for migration.

###############################################################################
# Authdaemon Protocol
###############################################################################
# postoffice-authd implements the authdaemon protocol expected by saslauthd:
#
# Request from saslauthd:
#   AUTH <mechanism>\n
#   <length>\n
#   <username>\n
#   <password>\n
#   [<realm>]\n
#
# Response:
#   OK\n                    # Authentication succeeded
#   NO\n                   # Authentication failed
#   FAIL <reason>\n       # Server error